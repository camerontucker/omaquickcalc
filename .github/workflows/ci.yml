name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install native verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils qalc qt6-declarative-dev-tools

      - name: Run unit and lifecycle tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Exercise the bundled evaluator
        run: |
          output="$(python3 omaquickcalc_backend.py evaluate --expression '2 + 2')"
          printf '%s\n' "$output"
          python3 -c 'import json, sys; result=json.loads(sys.argv[1]); assert result["ok"] and result["result"]' "$output"

      - name: Check scripts and Python syntax
        run: |
          bash -n install.sh uninstall.sh
          python3 -m py_compile omaquickcalc_backend.py omaquickcalc_setup.py

      - name: Check QML syntax
        run: /usr/lib/qt6/bin/qmllint OmaQuickCalc.qml

      - name: Check whitespace
        run: git show --check --format= --no-renames HEAD
