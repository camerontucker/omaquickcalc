name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install native verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils qalc qt6-declarative-dev-tools

      - name: Run unit and lifecycle tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Exercise the bundled evaluator
        run: |
          output="$(python3 omaquickcalc_backend.py evaluate --expression '2 + 2')"
          python3 -c 'import json, sys; result=json.loads(sys.argv[1]); assert result["ok"] and result["result"] == "4"' "$output"

      - name: Check scripts and Python syntax
        run: |
          bash -n install.sh uninstall.sh
          python3 -m py_compile omaquickcalc_backend.py omaquickcalc_setup.py

      - name: Check QML syntax
        run: /usr/lib/qt6/bin/qmllint OmaQuickCalc.qml

      - name: Check whitespace
        run: git show --check --format= --no-renames HEAD
